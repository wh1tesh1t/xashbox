                        same_line
                        image_button "Longjump" "ent_create item_longjump" "imguibox/longjump.tga" 100 100
                    }
                }
            }

            // YOU FIND SUS
            condition "imgui_language" == 1
            {
                tab "Главная"
                {
                    text "Серверные читы"
                    checkbox "Включить sv_cheats" "sv_cheats"
                    checkbox "Включить sv_enttools_enable" "sv_enttools_enable"
                    condition "sv_enttools_enable" >= 1
