window "Gayrry's Model Menu"
{
    // ERROS/WARNINGS
    condition "imgui_menu" != 1
    {
        text "ERROR: imgui_menu: can't load menu coz value is 0"
        text "Click at button to load special config:"
        separator
        button "Load config" "exec imgui-config"
    }
    condition "imgui_menu" >= 1
    {
        submenu "ImguiBox"
        {
            text "ImguiBox menu"
            separator
            checkbox "Enable Server Cheats" "sv_cheats"
            checkbox "Enable Server Entity Tools" "sv_enttools_enable"
            checkbox "Allow monsters" "mp_allowmonsters"
            slider_float "Maximum limit of touched entity by enttools" "sv_enttools_maxfire" 1.0 100.0
            separator
            condition "sv_cheats" >= 1
            {
                submenu "Actions on Self"
                {
                    button "Give all WPN" "impulse 101"
                    button "GodMode" "god"
                    button "Noclip" "noclip"
                    button "NoTarget" "notarget"
                    button "Give HealthKit" "give item_healthkit"
                    button "Give Battery" "give item_battery"
                    button "Give Suit" "give item_suit"
                    separator
                }
                condition "sv_enttools_enable" >= 1
                {
                    condition "mp_allowmonsters" >= 1
                    {
                        submenu "Actions on Entity"
                        {
                            tabbar "ImguiBoxEntity"
                            {
                                tab "Main"
                                {
                                    text "Main page"
                                    separator
                                    button "Run ent_create command" "messagemode ent_create"
                                    button "Show entity list" "ent_list;toggleconsole"
                                    separator
                                    condition "imgui_entity_id" >= 1
                                    {
                                        slider_int "Entity id" "imgui_entity_id" 1 255
                                        slider_int "Moveup Power" "imgui_moveup_value" 1 999
                                    }
                                    condition "imgui_movetype" >= 0
                                    {
                                        slider_int "MoveType value" "imgui_movetype" 1 13
                                    }
                                    condition "imgui_flag" >= 0
                                    {
                                        slider_int "Flag value" "imgui_flag" 0 31
                                    }
                                    condition "imgui_rendercolor" >= 1
                                    {
                                        color_cvar "Render Color" "imgui_rendercolor"
                                    }
                                    button "Set entity id" "messagemode imgui_entity_id"
                                    text "Example: 1,2,3,monster_barney,bigtits,!cross"
                                    button "Touch entity by id" "ent_fire $imgui_entity_id touch"
                                    button "Use entity by id" "ent_fire $imgui_entity_id use"
                                    separator
                                }
                                tab "Health"
                                {
                                    text "Health page"
                                    separator
                                    slider_float "set custom health" "imgui_custom_health" 0.0 10000.0
                                    text "Example: 100,200,350,1000"
                                    separator
                                    button "Set 0 health by id" "ent_fire $imgui_entity_id set health 0"
                                    button "Set 10 health by id" "ent_fire $imgui_entity_id set health 10"
                                    button "Set 50 health by id" "ent_fire $imgui_entity_id set health 50"
                                    button "Set 100 health by id" "ent_fire $imgui_entity_id set health 100"
                                    button "Set 500 health by id" "ent_fire $imgui_entity_id set health 500"
                                    button "Set 1000 health by id" "ent_fire $imgui_entity_id set health 1000"
                                    button "Set 5000 health by id" "ent_fire $imgui_entity_id set health 5000"
                                    button "Set 10000 health by id" "ent_fire $imgui_entity_id set health 10000"
                                    space
                                    button "Set custom health by id" "ent_fire $imgui_entity_id set health $imgui_custom_health"
                                    separator
                                }
                                tab "Gravity"
                                {
                                    text "Gravity page"
                                    separator
                                    slider_float "Custom Gravity" "imgui_gravity" 0.0 1.0
                                    text "Example: 0.5,0.2,1.0"
                                    slider_int "Server Gravity" "sv_gravity" 0 800
                                    separator
                                    space
                                    button "Set gravity to id" "ent_fire $imgui_entity_id gravity $imgui_gravity"
                                }
                                tab "Clean (unstable)"
                                {
                                    text "Clean menu"
                                    separator
                                    button "Remove entity with * flag" "ent_fire * setflag 30"
                                    button "Remove entity with weapon_* flag" "ent_fire weapon_* setflag 30"
                                    button "Remove entity with ammo_* flag" "ent_fire ammo_* setflag 30"
                                    button "Remove entity with item_* flag" "ent_fire item_* setflag 30"
                                    button "Remove entity with func_* flag" "ent_fire func_* setflag 30"
                                    button "Remove entity with monster_* flag" "ent_fire monster_* setflag 30"
                                    separator
                                }
                                tab "Move"
                                {
                                    text "Move entity page"
                                    separator
                                    button "Movehere id" "ent_fire $imgui_entity_id movehere"
                                    button "Moveup id" "ent_fire $imgui_entity_id moveup $imgui_moveup_value"
                                    button "Movedown id" "ent_fire $imgui_entity_id moveup -$imgui_moveup_value"
                                    button "Movehere + Drop id to the floor" "ent_fire $imgui_entity_id movehere;ent_fire $imgui_entity_id drop2floor"
                                    button "Drop id to the floor" "ent_fire $imgui_entity_id drop2floor"
                                    separator
                                    button "Set movetype by id" "ent_fire $imgui_entity_id movetype $imgui_movetype"
                                    submenu "Open me:)"
                                    {
                                        text "0 NONE - never moves"
                                        text "3 WALK - Player only - moving on the ground"
                                        text "4 STEP - gravity, special edge handling - monsters use this"
                                        text "5 FLY - No gravity, but still collides with stuff"
                                        text "6 TOSS - gravity/collisions"
                                        text "7 PUSH - no clip to world, push and crush"
                                        text "8 NOCLIP - No gravity, no collisions, still do velocity;9 FLYMISSILE - extra size to monsters"
                                        text "9 FLYMISSILE - extra size to monsters"
                                        text "10 BOUNCE - Just like Toss, but reflect velocity when contacting surfaces"
                                        text "11 BOUNCEMISSILE - bounce w/o gravity"
                                        text "12 FOLLOW - track movement of aiment"
                                        text "13 PUSHSTEP - BSP model that needs physics/world collisions (uses nearest hull for world collision)"
                                    }
                                    separator
                                }
                                tab "Solid"
                                {
                                    text "Solid menu"
                                    separator
                                    button "Set solid 0 by id" "ent_fire $imgui_entity_id solid 0"
                                    button "Set solid 1 by id" "ent_fire $imgui_entity_id solid 1"
                                    button "Set solid 2 by id" "ent_fire $imgui_entity_id solid 2"
                                    button "Set solid 3 by id" "ent_fire $imgui_entity_id solid 3"
                                    button "Set solid 4 by id" "ent_fire $imgui_entity_id solid 4"
                                    space
                                    submenu "Open me:)"
                                    {
                                        text "0 - no interaction with other objects"
                                        text "1 - touch on edge, but not blocking"
                                        text "2 - touch on edge, block"
                                        text "3 - touch on edge, but not an onground"
                                        text "4 - bsp clip, touch on edge, block"
                                        space
                                        text "NOTE: Some movetypes will cause collisions independent of SOLID_NOT/SOLID_TRIGGER when the entity moves;SOLID only effects OTHER entities colliding with this one when they move - UGH!"
                                    }
                                    separator
                                }
                                tab "Flag"
                                {
                                    button "Clear flag from id" "ent_fire $imgui_entity_id clearflag $imgui_flag"
                                    button "Set flag from id" "ent_fire $imgui_entity_id setflag $imgui_flag"
                                    separator
                                }
                            }
                        }
                    }
                }
            }
            submenu "Debug status"
            {
                condition "sv_cheats" != 1
                {
                  text "Cheats: Disabled"
                }
                condition "sv_cheats" >= 1
                {
                  text "Cheats: Enabled"
                }
                condition "sv_enttools_enable" != 1
                {
                  text "Entity Tools: Disabled"
                }
                condition "sv_enttools_enable" >= 1
                {
                  text "Entity Tools: Enabled"
                }
                condition "mp_allowmonsters" != 1
                {
                  text "Monsters: Disabled"
                }
                condition "mp_allowmonsters" >= 1
                {
                  text "Monsters: Enabled"
                }
                separator
            }
        }
        space
        button "Reload menu" "exec_menu imgui"
        close_menu "Close menu"
    }
}
