                        same_line
                        image_button "Sentry" "ent_create monster_sentry" "imguibox/sentry.tga" 100 100
                    }
                    
                    submenu "Items"
                    {
                        image_button "Healthkit" "ent_create item_healthkit" "imguibox/healthkit.tga" 100 100
                        same_line
                        image_button "Battery" "ent_create item_battery" "imguibox/battery.tga" 100 100
                        same_line
