window "ImGui — XashBox"
{
    // IMGUI_LANGUAGE: 0(IS ENGLISH), 1(RUSSIAN)
    // ERRORS/WARNINGS:
    condition "imgui_menu" != 1
    {
        condition "imgui_language" == 0
        {
            text "WARNING: NOT FOUND: "
            same_line
            cvar_check "imgui_menu" "imgui_menu"
            button "Load config" "exec imgui-config"
        }

        condition "imgui_language" == 1
        {
            text "WARNING: НЕ ОБНАРУЖЕН: "
            same_line
            cvar_check "imgui_menu" "imgui_menu"
            button "Загрузить конфиг" "exec imgui-config"
        }
    }
    
    // MENU HERE :)
    condition "imgui_menu" >= 1
    {
        tabbar "MenuImguiBox"
        {
            condition "imgui_language" == 0
            {
                tab "Main"
                {
                    text "Server cheats"
                    checkbox "Enable cheats" "sv_cheats"
                    checkbox "Enable entity tools" "sv_enttools_enable"
                    condition "sv_enttools_enable" >= 1
                    {
                        slider_int "Limit touched entity for ent_fire" "sv_enttools_maxfire" 1 255
                    }
                    checkbox "Server allow monsters" "mp_allowmonsters"
                    space
                    image "imguibox/weaponbox.tga" 32 32
                    same_line
                    button "Give all weapon" "impulse 101"
                    image "imguibox/empty.tga" 32 32
                    same_line
                    button "GodMode" "god"
                    image "imguibox/empty.tga" 32 32
                    same_line
                    button "Noclip" "noclip"
                    image "imguibox/empty.tga" 32 32
                    same_line
                    button "NoTarget" "notarget"
                    image "imguibox/healthkit.tga" 32 32
                    same_line
                    button "Give HealthKit" "give item_healthkit"
                    image "imguibox/battery.tga" 32 32
                    same_line
                    button "Give Battery" "give item_battery"
                    image "imguibox/suit.tga" 32 32
                    same_line
                    button "Give Suit" "give item_suit"
                }
            }
            
            condition "imgui_language" == 1
            {
                tab "Главная"
                {
                    text "Серверные читы"
                    checkbox "Включить читы" "sv_cheats"
                    checkbox "Включить энтити тулз" "sv_enttools_enable"
                    condition "sv_enttools_enable" >= 1
                    {
                        slider_int "Лимит затронутых энтити для ent_fire" "sv_enttools_maxfire" 1 255
                    }
                    checkbox "Сервер разрешает монстров" "mp_allowmonsters"
                    space
                    image "imguibox/weaponbox.tga" 32 32
                    same_line
                    button "Выдать все оружие" "impulse 101"
                    image "imguibox/empty.tga" 32 32
                    same_line
                    button "Режим бога" "god"
                    image "imguibox/empty.tga" 32 32
                    same_line
                    button "Ноуклип" "noclip"
                    image "imguibox/empty.tga" 32 32
                    same_line
                    button "Ноутаргет" "notarget"
                    image "imguibox/healthkit.tga" 32 32
                    same_line
                    button "Выдать аптечку" "give item_healthkit"
                    image "imguibox/battery.tga" 32 32
                    same_line
                    button "Выдать батарейку" "give item_battery"
                    image "imguibox/suit.tga" 32 32
                    same_line
                    button "Выдать костюм" "give item_suit"
                }
            }
        }

        condition "imgui_language" == 0
        {
            submenu "Language"
            {
                cvar_check "imgui_language" "imgui_language"
                button "Переключиться на Русский" "imgui_language 1"
            }
        }
        
        condition "imgui_language" == 1
        {
            submenu "Язык"
            {
                cvar_check "imgui_language" "imgui_language"
                button "Switch to English" "imgui_language 0"
            }
        }
    }

    // OTHER BUTTONS
    condition "imgui_language" == 0
    {
        button "Reload menu" "exec_menu imgui"
        space
        close_menu "Close menu"
    }
    

    condition "imgui_language" == 1
    {
        button "Перезагрузить меню" "exec_menu imgui"
        space
        close_menu "Закрыть меню"
    }
}
