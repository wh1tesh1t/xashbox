window "ImGui — XashBox"
{
    // IMGUI_LANGUAGE: 0(IS ENGLISH), 1(RUSSIAN)
    // ERRORS/WARNINGS:
    condition "imgui_menu" != 1
    {
        condition "imgui_language" == 0
        {
            text "WARNING: "
            same_line
            cvar_check "imgui_menu" "imgui_menu"
            button "Load config" "exec imgui-config"
        }

        condition "imgui_language" == 1
        {
            text "ПРЕДУПРЕЖДЕНИЕ: "
            same_line
            cvar_check "imgui_menu" "imgui_menu"
            button "Загрузить конфиг" "exec imgui-config"
        }
    }
    
    // MENU HERE :)
    condition "imgui_menu" >= 1
    {
        tabbar "MenuImguiBox"
        {
            condition "imgui_language" == 0
            {
                tab "Main"
                {
                    text "Server cheats"
                    checkbox "Enable cheats" "sv_cheats"
                    checkbox "Enable entity tools" "sv_enttools_enable"
                    condition "sv_enttools_enable" >= 1
                    {
                        slider_int "Limit touched entity for ent_fire" "sv_enttools_maxfire" 1 255
                    }
                    checkbox "Server allow spawn monsters" "mp_allowmonsters"
                    space
                    image "imguibox/weaponbox.tga" 32 32
                    same_line
                    button "Give weaponbox" "impulse 101"
                    image "imguibox/empty.tga" 32 32
                    same_line
                    button "Godmode" "god"
                    image "imguibox/empty.tga" 32 32
                    same_line
                    button "Noclip" "noclip"
                    image "imguibox/empty.tga" 32 32
                    same_line
                    button "Notarget" "notarget"
                    image "imguibox/healthkit.tga" 32 32
                    same_line
                    button "Give healthKit" "give item_healthkit"
                    image "imguibox/battery.tga" 32 32
                    same_line
                    button "Give battery" "give item_battery"
                    image "imguibox/suit.tga" 32 32
                    same_line
                    button "Give suit" "give item_suit"
                }
                
                tab "Actions on entities"
                {
                    cvar_check "ID" "imgui_entity_id"
                    button "Set entity ID" "messagemode imgui_entity_id"
                    condition "imgui_entity_id" >= 1
                    {
                        slider_int "255 max (default is 1)" "imgui_entity_id" 1 255
                    }
                    button "Actions on !cross" "imgui_entity_id !cross"
                    space
                    button "Touch entity" "ent_fire $imgui_entity_id touch"
                    button "Use entity" "ent_fire $imgui_entity_id use"
                    button "Delete entity" "ent_fire $imgui_entity_id setflag 30"

                    submenu "Health"
                    {
                        slider_float "Custom health" "imgui_custom_health" 0.0 10000.0
                        button "Set custom health" "ent_fire $imgui_entity_id set health $imgui_custom_health"
                        separator
                        button "Set 0 health" "ent_fire $imgui_entity_id set health 0"
                        button "Set 5 health" "ent_fire $imgui_entity_id set health 5"
                        button "Set 10 health" "ent_fire $imgui_entity_id set health 10"
                        button "Set 50 health" "ent_fire $imgui_entity_id set health 50"
                        button "Set 100 health" "ent_fire $imgui_entity_id set health 100"
                        button "Set 150 health" "ent_fire $imgui_entity_id set health 150"
                        button "Set 255 health" "ent_fire $imgui_entity_id set health 255"
                    }

                    submenu "Gravity"
                    {
                        text "Example: 0.5,0.2,1.0"
                        slider_float "Custom Gravity" "imgui_gravity" 0.0 1.0
                        button "Set" "ent_fire $imgui_entity_id gravity $imgui_gravity"
                        space
                        slider_int "Server Gravity" "sv_gravity" 0 800
                    }

                    submenu "Cleanup map"
                    {
                        cvar_check "enttools_maxfire" "sv_enttools_maxfire"
                        button "Remove all entity*" "ent_fire * setflag 30"
                        button "Remove weapon* entity (!!!unstable!!!)" "ent_fire weapon_* set targetname kebabremover ; ent_fire kebabremover* setflag 30"
                        button "Remove ammo* entity" "ent_fire ammo_* setflag 30"
                        button "Remove item* entity" "ent_fire item_* setflag 30"
                        button "Remove monster* entity" "ent_fire monster_* setflag 30"
                    }
                    
                    submenu "Move entity"
                    {
                        slider_int "Moveup Power" "imgui_moveup_value" 1 999
                        button "Moveup" "ent_fire $imgui_entity_id moveup $imgui_moveup_value"
                        button "Movedown" "ent_fire $imgui_entity_id moveup -$imgui_moveup_value"
                        button "Movehere" "ent_fire $imgui_entity_id movehere"
                        button "Movehere + Drop to the floor" "ent_fire $imgui_entity_id movehere;ent_fire $imgui_entity_id drop2floor"
                        button "Drop to the floor" "ent_fire $imgui_entity_id drop2floor"
                        separator
                        condition "imgui_movetype" >= 0
                        {
                            slider_int "Movetype Value" "imgui_movetype" 1 13
                            button "Set" "ent_fire $imgui_entity_id movetype $imgui_movetype"
                        }

                        submenu "Open me:)"
                        {
                            text "0 NONE - never moves"
                            text "3 WALK - Player only - moving on the ground"
                            text "4 STEP - gravity, special edge handling - monsters use this"
                            text "5 FLY - No gravity, but still collides with stuff"
                            text "6 TOSS - gravity/collisions"
                            text "7 PUSH - no clip to world, push and crush"
                            text "8 NOCLIP - No gravity, no collisions, still do velocity;9 FLYMISSILE - extra size to monsters"
                            text "9 FLYMISSILE - extra size to monsters"
                            text "10 BOUNCE - Just like Toss, but reflect velocity when contacting surfaces"
                            text "11 BOUNCEMISSILE - bounce w/o gravity"
                            text "12 FOLLOW - track movement of aiment"
                            text "13 PUSHSTEP - BSP model that needs physics/world collisions (uses nearest hull for world collision)"
                        }
                    }

                    submenu "Solid"
                    {
                        slider_int "Solid Value" "imgui_solid" 0 4
                        button "Set" "ent_fire $imgui_entity_id solid $imgui_solid"
                        
                        submenu "Open me:)"
                        {
                            text "0 - no interaction with other objects"
                            text "1 - touch on edge, but not blocking"
                            text "2 - touch on edge, block"
                            text "3 - touch on edge, but not an onground"
                            text "4 - bsp clip, touch on edge, block"
                            space
                            text "NOTE: Some movetypes will cause collisions independent of SOLID_NOT/SOLID_TRIGGER when the entity moves"
                            text "SOLID only effects OTHER entities colliding with this one when they move - UGH!"
                        }
                    }
                    
                    submenu "Setflag"
                    {
                        slider_int "Flag Value" "imgui_flag" 0 31
                        button "Set" "ent_fire $imgui_entity_id solid $imgui_flag"
                        button "Clear" "ent_fire $imgui_entity_id clearflag $imgui_flag"
                        
                        submenu "Open me:)"
                        {
                            text "0 FLY - Changes the SV_Movestep() behavior to not need to be on ground"
                            text "1 SWIM - same (but stay in water)"
                            text "2 CONVEYOR"
                            text "3 CLIENT"
                            text "4 INWATER"
                            text "5 MONSTER"
                            text "6 GODMODE"
                            text "7 NOTARGET"
                            text "8 SKIPLOCALHOST - Don't send entity to local host, it's predicting this entity itself"
                            text "9 ONGROUND - At rest / on the ground"
                            text "10 PARTIALGROUND - not all corners are valid"
                            text "11 WATERJUMP - player jumping out of water"
                            text "12 FROZEN - Player is frozen for 3rd person camera"
                            text "13 FAKECLIENT - JAC: fake client, simulated server side"
                            text "14 DUCKING - Player flag ? Player is fully crouched"
                            text "15 FLOAT - Apply floating force to this entity when in water"
                            text "16 GRAPHED - worldgraph has this ent listed as something that blocks a connection"
                            text "20 PROXY - This is a spectator proxy"
                            text "21 ALWAYSTHINK - Brush model flag ? call think every frame regardless of nextthink - ltime (for constantly changing velocity/path)"
                            text "22 BASEVELOCITY - Base velocity has been applied this frame"
                            text "23 MONSTERCLIP - Only collide in with monsters who have MONSTERCLIP set"
                            text "24 ONTRAIN - Player is _controlling_ a train, so movement commands should be ignored on client during prediction."
                            text "25 WORLDBRUSH - Not moveable/removeable brush entity"
                            text "26 SPECTATOR - This client is a spectator"
                            text "29 CUSTOMENTITY - This is a custom entity"
                            text "30 KILLME - This entity is marked for death"
                            text "31 DORMANT - Entity is dormant, no updates to client"
                        }
                    }
                    submenu "Render"
                    {
                        condition "imgui_rendermode" >= 0
                        {
                            slider_int "Render MODE" "imgui_rendermode" 0 5
                        }
                        
                        condition "imgui_rendercolor" >= 1
                        {
                            color_cvar "Render COLOR" "imgui_rendercolor"
                        }
                        
                        condition "imgui_renderfx" >= 0
                        {
                            slider_int "Render FX" "imgui_renderfx" 0 16
                        }
                        
                        condition "imgui_renderamt" >= 0
                        {
                            slider_int "Render AMT" "imgui_renderamt" 0 255
                        }
                        button "Set render" "ent_fire $imgui_entity_id rendermode $imgui_rendermode ; ent_fire $imgui_entity_id rendercolor $imgui_rendercolor ; ent_fire $imgui_entity_id renderfx $imgui_renderfx ; ent_fire $imgui_entity_id renderamt $imgui_renderamt"
                    }
                }
                
                tab "Spawn entity"
                {
                    button "Spawn using entity name" "messagemode ent_create"
                    same_line
                    text " — example: monster_barney, item_suit, weapon_crossbow"

                    submenu "NPC"
                    {
                        text "Monsters"
                        space

                        image_button "Zombie" "ent_create monster_zombie" "imguibox/zombie.tga" 100 100
                        same_line
                        image_button "Vortigaunt" "ent_create monster_vortigaunt" "imguibox/vortigaunt.tga" 100 100
                        same_line
