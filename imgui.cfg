                            text "8 NOCLIP — без гравитации и коллизий, но сохраняется скорость"
                            text "9 FLYMISSILE — как FLY, но с увеличенным размером для монстров"
                            text "10 BOUNCE — как TOSS, но скорость отражается при контакте с поверхностями"
                            text "11 BOUNCEMISSILE — отскок без гравитации"
                            text "12 FOLLOW — следует за движением своей цели (aiment)"
                            text "13 PUSHSTEP — BSP-модель, требующая физики и коллизий с миром (использует ближайший халл для коллизий)"
                        }
                    }
                    
                    submenu "Солид (Solid)"
                    {
                        slider_int "Значение солида" "imgui_solid" 0 4
                        button "Установить" "ent_fire $imgui_entity_id solid $imgui_solid"
    
                        submenu "Открой меня :)"
                        {
                            text "0 — нет взаимодействия с другими объектами"
                            text "1 — соприкосновение по краю, но без блокировки"
                            text "2 — соприкосновение по краю с блокировкой"
                            text "3 — соприкосновение по краю, но не считается «на земле»"
                            text "4 — BSP-клип, соприкосновение по краю с блокировкой"
                            space
                            text "ПРИМЕЧАНИЕ: Некоторые типы движения вызывают коллизии независимо от SOLID_NOT/SOLID_TRIGGER при перемещении сущности"
                            text "Солидность влияет ТОЛЬКО на другие сущности, сталкивающиеся с этой при их движении — УФ!"
                        }
                    }

                    submenu "Установка флагов"
                    {
                        slider_int "Значение флага" "imgui_flag" 0 31
                        button "Установить" "ent_fire $imgui_entity_id setflag $imgui_flag"
                        button "Сбросить" "ent_fire $imgui_entity_id clearflag $imgui_flag"
    
                        submenu "Открой меня :)"
                        {
                            text "0 FLY — изменяет поведение SV_Movestep(): не обязательно быть на земле"
                            text "1 SWIM — аналогично (но остаётся в воде)"
                            text "2 CONVEYOR — конвейер"
                            text "3 CLIENT — клиентская сущность"
                            text "4 INWATER — в воде"
                            text "5 MONSTER — монстр"
                            text "6 GODMODE — бессмертие"
                            text "7 NOTARGET — невидимость для врагов"
                            text "8 SKIPLOCALHOST — не отправлять сущность локальному хосту (он сам предсказывает её)"
                            text "9 ONGROUND — в покое / на земле"
                            text "10 PARTIALGROUND — не все углы находятся на земле"
                            text "11 WATERJUMP — игрок выпрыгивает из воды"
                            text "12 FROZEN — игрок заморожен (для камеры от 3-го лица)"
                            text "13 FAKECLIENT — фейковый клиент, эмулируется на сервере"
                            text "14 DUCKING — игрок полностью присел"
                            text "15 FLOAT — применять подъёмную силу в воде"
                            text "16 GRAPHED — сущность указана в worldgraph как блокирующая соединение"
                            text "20 PROXY — прокси-сущность для наблюдателя"
                            text "21 ALWAYSTHINK — вызывать функцию think каждый кадр, независимо от nextthink (для постоянно меняющейся скорости/траектории)"
                            text "22 BASEVELOCITY — базовая скорость применена в этом кадре"
                            text "23 MONSTERCLIP — сталкиваться только с монстрами, у которых установлен MONSTERCLIP"
                            text "24 ONTRAIN — игрок УПРАВЛЯЕТ поездом; команды движения на клиенте игнорируются при предсказании"
                            text "25 WORLDBRUSH — неподвижная/неудаляемая brush-сущность"
                            text "26 SPECTATOR — этот клиент — наблюдатель"
                            text "29 CUSTOMENTITY — пользовательская сущность"
                            text "30 KILLME — сущность помечена на удаление"
                            text "31 DORMANT — сущность неактивна, обновления не отправляются клиенту"
                        }
                    }

                    submenu "Отрисовка (Render)"
                    {
                        condition "imgui_rendermode" >= 0
                        {
                            slider_int "Режим отрисовки" "imgui_rendermode" 0 5
                        }
    
                        condition "imgui_rendercolor" >= 1
                        {
                            color_cvar "Цвет отрисовки" "imgui_rendercolor"
                        }
    
                        condition "imgui_renderfx" >= 0
                        {
                            slider_int "Эффект отрисовки" "imgui_renderfx" 0 16
                        }
    
                        condition "imgui_renderamt" >= 0
                        {
                            slider_int "Интенсивность отрисовки" "imgui_renderamt" 0 255
                        }
                        button "Применить отрисовку" "ent_fire $imgui_entity_id rendermode $imgui_rendermode ; ent_fire $imgui_entity_id rendercolor $imgui_rendercolor ; ent_fire $imgui_entity_id renderfx $imgui_renderfx ; ent_fire $imgui_entity_id renderamt $imgui_renderamt"
                    }
                }
            }
        }
        
        space
        space

        condition "imgui_language" == 0
        {
            submenu "Language"
            {
                cvar_check "imgui_language" "imgui_language"
                button "Переключиться на Русский" "imgui_language 1"
            }
        }
        
        condition "imgui_language" == 1
        {
            submenu "Язык"
            {
                cvar_check "imgui_language" "imgui_language"
                button "Switch to English" "imgui_language 0"
            }
        }
    }

    // OTHER BUTTONS
    condition "imgui_language" == 0
    {
        button "Reload menu" "exec_menu imgui"
        space
        close_menu "Close menu"
    }
    

    condition "imgui_language" == 1
    {
        button "Перезагрузить меню" "exec_menu imgui"
        space
        close_menu "Закрыть меню"
    }
    
    condition "imgui_git_watermark" >= 1
    {
        space
        space
        space
        space
        space
        image "imguibox/github.tga" 22 22
        same_line
        text " Github: https://github.com/wh1tesh1t"
        image "imguibox/telegram.tga" 22 22
        same_line
        text " Telegram: t.me/wh1tesh1t"

        condition "imgui_language" == 0
        {
            button "Hide watermark" "imgui_git_watermark 0"
        }
        
        condition "imgui_language" == 1
        {
            button "Скрыть ватермарку" "imgui_git_watermark 0"
        }
    }
