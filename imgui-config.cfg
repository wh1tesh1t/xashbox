set imgui_menu 1
set imgui_entity_id "1"
set imgui_custom_health 100
set imgui_gravity 1.0
set imgui_moveup_value 25
set imgui_rendermode 0
set imgui_renderfx "0"
set imgui_rendercolor "255 255 255"
set imgui_renderamt "100"
set imgui_movetype 0
set imgui_flag "0"
set imgui_bind 0
set imgui_bind_key "v"
set imgui_language 1 // 0 - English, 1 - Russian
set imgui_git_watermark 1

alias "imguimenu" "exec_menu imgui"

if $imgui_bind >= 1
:bind "$imgui_bind_key" "imguimenu"
